      <text x="20" y="29" text-anchor="middle" font-family="'Inter'" font-weight="bold" font-size="12" fill="#f59e0b">01</text>
      <text x="50" y="20" class="body-text" font-weight="bold" fill="#ffffff">官方权威资质长廊 &amp; 演讲画廊</text>
      <text x="50" y="36" class="body-text" fill="#94a3b8">收录 GITEX Asia, ICCA, 客户服务节现场高精物理大图</text>
