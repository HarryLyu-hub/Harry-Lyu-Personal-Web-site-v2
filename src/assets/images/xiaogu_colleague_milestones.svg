<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0e1424" />
      <stop offset="100%" stop-color="#04060b" />
    </linearGradient>
    
    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Accent Blue/Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#131b31" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0c111f" stop-opacity="0.95" />
    </linearGradient>

    <!-- Light Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-main { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 900; font-size: 34px; fill: #ffffff; letter-spacing: -0.5px; }
    .title-sub { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 700; font-size: 14px; fill: #f59e0b; letter-spacing: 2px; text-transform: uppercase; }
    .card-title { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 16px; fill: #fbbf24; }
    .card-stat { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 800; font-size: 42px; fill: #ffffff; }
    .card-label { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 12px; fill: #94a3b8; }
    .body-text { font-family: 'Inter', system-ui, -apple-system, sans-serif; font-style: normal; font-size: 12px; fill: #cbd5e1; }
    .bold-text { font-weight: 700; fill: #ffffff; }
    .tag-text { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 9px; fill: #f59e0b; }
  </style>

  <!-- Outer background rect -->
  <rect width="1200" height="675" rx="24" fill="url(#bgGrad)" />
  
  <!-- Subtle Grid Lines in Background -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="675" />
    <line x1="200" y1="0" x2="200" y2="675" />
    <line x1="300" y1="0" x2="300" y2="675" />
    <line x1="400" y1="0" x2="400" y2="675" />
    <line x1="500" y1="0" x2="500" y2="675" />
    <line x1="600" y1="0" x2="600" y2="675" />
    <line x1="700" y1="0" x2="700" y2="675" />
    <line x1="800" y1="0" x2="800" y2="675" />
    <line x1="900" y1="0" x2="900" y2="675" />
    <line x1="1000" y1="0" x2="1000" y2="675" />
    <line x1="1100" y1="0" x2="1100" y2="675" />
    
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Glowing Accent Orbs in Background -->
  <circle cx="100" cy="150" r="120" fill="#f59e0b" opacity="0.03" filter="url(#glow)" />
  <circle cx="1100" cy="550" r="150" fill="#06b6d4" opacity="0.04" filter="url(#glow)" />

  <!-- HEADER SECTION -->
  <g transform="translate(60, 50)">
    <!-- Tech Tag -->
    <rect x="0" y="0" width="160" height="20" rx="6" fill="#f59e0b" fill-opacity="0.1" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1" />
    <text x="80" y="13" text-anchor="middle" class="tag-text">HUMAN-AI COLLABORATION</text>
    
    <!-- Title and subtitle -->
    <text x="0" y="55" class="title-main">吕华 &amp; 小谷 (AI Coder) 协同研发纪实</text>
    <text x="0" y="80" class="title-sub">Outbound Business &amp; Cultural Map Sandbox Prototyping Review</text>

    <!-- Version badge -->
    <rect x="730" y="32" width="130" height="26" rx="13" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="745" cy="45" r="4" fill="#10b981" />
    <text x="756" y="49" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34d399">ACTIVE CODER</text>
  </g>

  <!-- BENTO GRID SYSTEM -->

  <!-- Card 1: Iterations (Top Left) -->
  <g transform="translate(60, 160)">
    <rect width="320" height="210" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1" />
    <!-- Mini accent corner indicator -->
    <path d="M 0 16 A 16 16 0 0 1 16 0 L 40 0 L 0 40 Z" fill="#f59e0b" opacity="0.8" />
    <text x="45" y="35" class="card-title">敏捷迭代频次 / ITERATIONS</text>
    <text x="30" y="105" class="card-stat">28+</text>
    <text x="125" y="100" class="card-label">原型重构周期</text>
    <text x="30" y="145" class="body-text" font-weight="bold">● 高鲁棒自愈保障 (Protocol B)</text>
    <text x="30" y="165" class="body-text">全量静态资产声明引用，杜绝运行态脏数据故障</text>
    <text x="30" y="185" class="body-text">与吕老师高效率契约化协同，做到修改 100% 对准</text>
  </g>

  <!-- Card 2: Code Metrics (Bottom Left) -->
  <g transform="translate(60, 390)">
    <rect width="320" height="225" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1" />
    <text x="30" y="35" class="card-title">精良代码质量 / CRAFTSMANSHIP</text>
    <text x="30" y="100" class="card-stat">6,400+</text>
    <text x="180" y="95" class="card-label">行完备 TS 代码</text>
    
    <!-- Code stats breakout -->
    <rect x="30" y="125" width="260" height="75" rx="8" fill="#0a0f1d" stroke="#1e293b" />
    <text x="45" y="145" class="body-text" font-weight="bold" fill="#f59e0b">类型系统 (TypeScript):</text>
    <text x="185" y="145" class="body-text" font-family="monospace">100% Safe</text>
    <text x="45" y="165" class="body-text" font-weight="bold" fill="#06b6d4">界面渲染 (Vite + React):</text>
    <text x="185" y="165" class="body-text" font-family="monospace">0.1s Ready</text>
    <text x="45" y="185" class="body-text" font-weight="bold" fill="#10b981">CSS 系统 (Tailwind CSS):</text>
    <text x="185" y="185" class="body-text" font-family="monospace">Responsive</text>
  </g>

