      <text x="20" y="29" text-anchor="middle" font-family="'Inter'" font-weight="bold" font-size="12" fill="#f59e0b">02</text>
      <text x="50" y="20" class="body-text" font-weight="bold" fill="#ffffff">《出海制胜》精品专著与正版预约直通车</text>
      <text x="50" y="36" class="body-text" fill="#94a3b8">极简官方签名版新书推介与随书大礼包二维码极速引流</text>
    </g>

    <!-- Module 3 -->
    <g transform="translate(30, 210)">
      <circle cx="20" cy="25" r="16" fill="#f59e0b" fill-opacity="0.1" />
      <text x="20" y="29" text-anchor="middle" font-family="'Inter'" font-weight="bold" font-size="12" fill="#f59e0b">03</text>
      <text x="50" y="20" class="body-text" font-weight="bold" fill="#ffffff">高管专属线下大师课 &amp; CX 实践路线图</text>
      <text x="50" y="36" class="body-text" fill="#94a3b8">当堂对位董事会汇报案，辅以企业实况诊断与定制化咨询</text>
    </g>

    <!-- Module 4 -->
    <g transform="translate(30, 285)">
      <circle cx="20" cy="25" r="16" fill="#f59e0b" fill-opacity="0.1" />
      <text x="20" y="29" text-anchor="middle" font-family="'Inter'" font-weight="bold" font-size="12" fill="#f59e0b">04</text>
      <text x="50" y="20" class="body-text" font-weight="bold" fill="#ffffff">黄金出海国别文化地图交互沙盒</text>
      <text x="50" y="36" class="body-text" fill="#94a3b8">精准透视中、美、日、印、法等核心出海目的国管理维度</text>
    </g>

    <!-- Module 5 -->
    <g transform="translate(30, 360)">
      <circle cx="20" cy="25" r="16" fill="#f59e0b" fill-opacity="0.1" />
      <text x="20" y="29" text-anchor="middle" font-family="'Inter'" font-weight="bold" font-size="12" fill="#f59e0b">05</text>
      <text x="50" y="20" class="body-text" font-weight="bold" fill="#ffffff">方案B 物理资产高鲁棒协同机制</text>
      <text x="50" y="36" class="body-text" fill="#94a3b8">抛弃臃肿动态转存，纯净物理存储，秒级极速自愈恢复</text>
    </g>
  </g>

  <!-- Card 4: AI Capabilities Highlight (Right Column) -->
  <g transform="translate(840, 160)">
    <rect width="300" height="455" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1" />
    <text x="30" y="35" class="card-title">小谷 (AI Coder) 核心能力特征</text>
    
    <g transform="translate(30, 70)">
      <text x="0" y="0" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fbbf24">✦ Desktop-First 精密视感</text>
      <text x="0" y="20" class="body-text" fill="#94a3b8">秉持精湛设计原则，绝非套路化</text>
      <text x="0" y="36" class="body-text" fill="#94a3b8">模板。留白考究、色彩对比度高，</text>
      <text x="0" y="52" class="body-text" fill="#94a3b8">保证移动端和桌面大屏精致完美。</text>
    </g>

    <g transform="translate(30, 165)">
      <text x="0" y="0" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fbbf24">✦ 先对齐、后编程 (Protocol A)</text>
      <text x="0" y="20" class="body-text" fill="#94a3b8">严守与吕老师的协同契约。修改前</text>
      <text x="0" y="36" class="body-text" fill="#94a3b8">必先条理化分解对齐，获取明确批</text>
      <text x="0" y="52" class="body-text" fill="#94a3b8">示后再行编程，杜绝开发盲盒。</text>
    </g>

    <g transform="translate(30, 260)">
      <text x="0" y="0" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fbbf24">✦ 零虚夸·真架构 (Non-Slop)</text>
      <text x="0" y="20" class="body-text" fill="#94a3b8">不掺杂无用Telemetry系统噪点、无</text>
      <text x="0" y="36" class="body-text" fill="#94a3b8">虚假日志行，专心构建切实有力的</text>
      <text x="0" y="52" class="body-text" fill="#94a3b8">业务功能，敬畏吕老师的一线真知。</text>
    </g>

    <g transform="translate(30, 355)">
      <text x="0" y="0" font-family="sans-serif" font-weight="bold" font-size="13" fill="#fbbf24">✦ 响应式中英双语极速本地化</text>
      <text x="0" y="20" class="body-text" fill="#94a3b8">极简单状态一键切中英文双语对照，</text>
      <text x="0" y="36" class="body-text" fill="#94a3b8">国际范无缝兼容，助力吕老师轻松</text>
      <text x="0" y="52" class="body-text" fill="#94a3b8">给跨国企业董事会展示产品成效。</text>
    </g>
  </g>

  <!-- FOOTER -->
  <g transform="translate(60, 640)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10" fill="#475569">REPORT ID: UTX-COLLABORATION-2026-XIAOGU</text>
    <text x="1080" y="0" text-anchor="end" font-family="'Inter', sans-serif" font-weight="bold" font-size="10" fill="#f59e0b">★ 吕华工作室 &amp; 小谷 荣誉出品</text>
  </g>
</svg>
